<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BON4R FASHION</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:'Segoe UI',sans-serif;
            background:#fafafa;
        }

       header{
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    padding:20px;

    position:sticky;
    top:0;
    z-index:1000;
}

        .header-top{
            max-width:1200px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h1{
            margin:0;
            font-size:38px;
        }

        header p{
            margin:5px 0 0 0;
            color:#666;
        }

        #carrito-contador{
            background:#111;
            color:white;
            padding:12px 20px;
            border-radius:999px;
            font-weight:bold;
        }

        .hero{
            margin-top:0;
            height:400px;

            background:
            linear-gradient(
                rgba(0,0,0,.45),
                rgba(0,0,0,.45)
            ),
            url("imagenes/playera-negra.jpg");

            background-size:cover;
            background-position:center;

            display:flex;
            justify-content:center;
            align-items:center;

            text-align:center;
            color:white;
        }

        .hero h2{
            font-size:56px;
            margin:0;
        }

        .hero p{
            font-size:20px;
            margin-top:10px;
        }

        .btn-ver{
            display:inline-block;
            margin-top:20px;
            background:white;
            color:black;
            text-decoration:none;
            padding:12px 25px;
            border-radius:10px;
            font-weight:bold;
        }

        .contenedor{
            max-width:1200px;
            margin:auto;
            padding:30px;
        }

        #buscador{
            width:100%;
            padding:15px;
            font-size:16px;
            border:1px solid #ddd;
            border-radius:12px;
            margin-bottom:30px;
        }
        

        .catalogo{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card img{
            width:100%;
            height:350px;
            object-fit:cover;
        }

        .info{
            padding:20px;
        }

        .info h3{
            margin-top:0;
        }

        .precio{
            color:#00a43c;
            font-size:28px;
            font-weight:bold;
        }

        .tallas{
            color:#666;
        }

        .btn-carrito{
            width:100%;
            border:none;
            background:#111;
            color:white;
            padding:12px;
            border-radius:10px;
            font-weight:bold;
            cursor:pointer;
            margin-top:15px;
        }

        .btn-carrito:hover{
            background:#333;
        }
        #panel-carrito{
    position:fixed;
    top:0;
    right:-400px;
    width:350px;
    height:100%;
    background:white;
    box-shadow:-5px 0 15px rgba(0,0,0,.2);
    padding:20px;
    transition:.3s;
    overflow-y:auto;
    z-index:2000;
}

#panel-carrito.abierto{
    right:0;
}

.item-carrito{
    padding:10px 0;
    border-bottom:1px solid #ddd;
}
#mensaje-exito{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#28a745;
    color:white;
    padding:15px 20px;
    border-radius:10px;
    font-weight:bold;
    box-shadow:0 4px 15px rgba(0,0,0,.2);

    opacity:0;
    visibility:hidden;

    transition:.3s;

    z-index:3000;
}

#mensaje-exito.mostrar{
    opacity:1;
    visibility:visible;
}
        #btn-finalizar{
    width:100%;
    background:#28a745;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

#btn-finalizar:hover{
    background:#218838;
}
        .header-carrito{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#cerrar-carrito{
    border:none;
    background:none;
    font-size:24px;
    cursor:pointer;
}
        .item-superior{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.btn-eliminar{
    border:none;
    background:none;
    cursor:pointer;
    font-size:20px;
    padding:5px;
}

.btn-eliminar:hover{
    transform:scale(1.1);
}
#modal-cliente{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    z-index:5000;
}

#contenido-cliente{
    background:white;
    width:500px;
    max-width:90%;
    margin:100px auto;
    padding:25px;
    border-radius:15px;
}
        .header-modal{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#cerrar-modal{
    border:none;
    background:none;
    font-size:24px;
    cursor:pointer;
    padding:5px 10px;
}
        #btn-continuar-pedido{
    width:100%;
    background:#007bff;
    color:white;
    border:none;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    margin-top:15px;
}

#btn-continuar-pedido:hover{
    background:#0056b3;
}
        #btn-enviar-pedido{
    width:100%;
    background:#28a745;
    color:white;
    border:none;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    margin-top:15px;
}
        #categorias{
    display:flex;
    gap:10px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

#categorias button{
    border:none;
    background:#111;
    color:white;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
}

#categorias button:hover{
    background:#333;
}
    </style>

</head>

<body>

<header>

    <div class="header-top">

        <div>
            <h1>Mexicali's Fashion</h1>
            <p>Moda para cualquier ocasión</p>
        </div>

       <div id="carrito-contador" onclick="toggleCarrito()">
    🛒 0
</div>

    </div>

</header>

<section class="hero">

    <div>

        <h2>Nueva Colección</h2>

        <p>
            Descubre prendas seleccionadas para cualquier ocasión
        </p>

      <a href="#catalogo" class="btn-ver">
    Ver Catálogo
</a>

    </div>

</section>

<div class="contenedor">

    <input
        type="text"
        id="buscador"
        placeholder="🔍 Buscar producto..."
    >

    <div id="categorias">

        <button onclick="filtrarCategoria('Todos')">
            Todos
        </button>

        <button onclick="filtrarCategoria('Vestidos')">
            Vestidos
        </button>

        <button onclick="filtrarCategoria('Playeras')">
            Playeras
        </button>

        <button onclick="filtrarCategoria('Blusas')">
            Blusas
        </button>

        <button onclick="filtrarCategoria('Pantalones')">
            Pantalones
        </button>

    </div>

    <div class="catalogo" id="catalogo"></div>

</div>

<script>

let carrito = [];
let productosGlobal = [];
let clienteActual = null;
let categoriaActual = 'Todos';

fetch('productos.json')
.then(response => response.json())
.then(productos => {

    productosGlobal = productos;

    renderizarProductos(productos);

})
.catch(error => {

    console.error(error);

    document.getElementById('catalogo').innerHTML =
    '<h2>Error cargando productos</h2>';

});

function renderizarProductos(productos){

    let html = '';

    productos.forEach(producto => {

        html += `
        <div class="card">

            <img src="${producto.imagen}" alt="${producto.nombre}">

            <div class="info">

                <h3>${producto.nombre}</h3>

                <p class="precio">
                    $${producto.precio}
                </p>

                <p class="tallas">
                    Tallas: ${producto.tallas}
                </p>

                <button
                    class="btn-carrito"
                    onclick="agregarCarrito('${producto.sku}')">

                    🛒 Agregar al carrito

                </button>

            </div>

        </div>
        `;

    });

    document.getElementById('catalogo').innerHTML = html;

}

function agregarCarrito(sku){

    const producto =
        productosGlobal.find(p => p.sku === sku);

    carrito.push(producto);

    document.getElementById('carrito-contador').innerText =
    '🛒 ' + carrito.length;

    actualizarCarrito();
    const mensaje =
    document.getElementById('mensaje-exito');

mensaje.classList.add('mostrar');

setTimeout(() => {

    mensaje.classList.remove('mostrar');

}, 2000);

}
    function eliminarDelCarrito(index){

    carrito.splice(index, 1);

    document.getElementById('carrito-contador').innerText =
        '🛒 ' + carrito.length;

    actualizarCarrito();

}
    function toggleCarrito(){

    document
        .getElementById('panel-carrito')
        .classList.toggle('abierto');

}
    
function abrirFormularioCliente(){

    document.getElementById('modal-cliente').style.display =
    'block';

    document.getElementById('contenido-dinamico').innerHTML =
        '';

}
function cerrarModalCliente(){

    document.getElementById('modal-cliente').style.display =
    'none';

}
    function clienteNuevo(){

    document.getElementById('contenido-dinamico').innerHTML = `

        <hr>

        <input
            id="nombreCliente"
            type="text"
            placeholder="Nombre Completo"
            style="width:100%;padding:10px;margin-top:10px;"
        >

        <input
            id="telefonoCliente"
            type="text"
            placeholder="Celular"
            style="width:100%;padding:10px;margin-top:10px;"
        >

        <input
            id="correoCliente"
            type="email"
            placeholder="Correo Electrónico"
            style="width:100%;padding:10px;margin-top:10px;"
        >

        <button
            onclick="registrarCliente()"
            style="width:100%;padding:12px;margin-top:15px;">

            Registrar Cliente

        </button>

    `;

}
   function registrarCliente(){

    const clienteId =
        'MXF-' + Math.floor(Math.random() * 9000 + 1000);

    const nombre =
        document.getElementById('nombreCliente').value;

    const celular =
        document.getElementById('telefonoCliente').value;

    const correo =
        document.getElementById('correoCliente').value;

    fetch(
        'https://script.google.com/macros/s/AKfycbzqVeUqNlvnC4tuK3skX575NebZcIsZx2V6QhPhoxbh_ygLEUINBzQZrZLUBLlui7Gn/exec'
        ,
        {
            method:'POST',
            mode:'no-cors',
            body:JSON.stringify({
                clienteId:clienteId,
                nombre:nombre,
                celular:celular,
                correo:correo
            })
        }
    )
    .then(() => {
     localStorage.setItem(
        'clienteId',
        clienteId
    );
        alert(
            '✅ Cliente registrado\n\n' +
            'Su número de cliente es:\n\n' +
            clienteId +
            '\n\nGuárdelo para futuras compras.'
        );

        cerrarModalCliente();

    })
    .catch(error => {

        console.error(error);

        alert('Error registrando cliente');

    });

}
    function soyCliente(){
const clienteGuardado =
    localStorage.getItem('clienteId');
    document.getElementById('contenido-dinamico').innerHTML = `

        <hr>

    <input
    id="clienteExistente"
    type="text"
    placeholder="Número de Cliente (MXF-1001)"
    value="${clienteGuardado || ''}"
    style="width:100%;padding:10px;margin-top:10px;"
>

        <button
            onclick="buscarCliente()"
            style="width:100%;padding:12px;margin-top:15px;">

            Buscar Cliente

        </button>

    `;

}

    function buscarCliente(){

    const clienteId =
        document.getElementById('clienteExistente').value;

    fetch(
        'https://script.google.com/macros/s/AKfycbzqVeUqNlvnC4tuK3skX575NebZcIsZx2V6QhPhoxbh_ygLEUINBzQZrZLUBLlui7Gn/exec?clienteId=' +
        encodeURIComponent(clienteId)
    )
    .then(response => response.json())
    .then(data => {

        if(data.encontrado){
        localStorage.setItem(
        'clienteId',
        data.clienteId
    );
            clienteActual = data;

            document.getElementById('contenido-dinamico').innerHTML = `

                <hr>

                <h3>✅ Cliente encontrado</h3>

                <p>
                    <strong>Nombre:</strong><br>
                    ${data.nombre}
                </p>

                <p>
                    <strong>Celular:</strong><br>
                    ${data.celular}
                </p>

                <p>
                    <strong>Correo:</strong><br>
                    ${data.correo}
                </p>

                <button
                    id="btn-continuar-pedido"
                    onclick="continuarPedido()">

                    Continuar con Pedido

                </button>

            `;

        }
        else{

            alert('❌ Cliente no encontrado');

        }

    })
    .catch(error => {

        console.error(error);

        alert('Error buscando cliente');

    });

}
function continuarPedido(){

    document.getElementById('contenido-dinamico').innerHTML = `

        <hr>

        <h3>Resumen del Pedido</h3>

        <div id="resumen-pedido"></div>

        <button
            id="btn-enviar-pedido"
            onclick="enviarPedido()">

            Enviar Pedido

        </button>

    `;

    let html = '';

    carrito.forEach(producto => {

        html += `
            <p>
                ${producto.nombre}
                - $${producto.precio}
            </p>
        `;

    });

    document.getElementById('resumen-pedido').innerHTML =
        html;

}
 function enviarPedido(){

    const boton =
        document.getElementById('btn-enviar-pedido');

    boton.disabled = true;
    boton.innerText = 'Procesando pedido...';

    const pedidoId =
        'PED-' + Math.floor(Math.random() * 90000 + 10000);

    let total = 0;

    const productos = carrito.map(producto => {

        total += Number(producto.precio);

        return producto.nombre;

    }).join(', ');

    fetch(
        'https://script.google.com/macros/s/AKfycbzqVeUqNlvnC4tuK3skX575NebZcIsZx2V6QhPhoxbh_ygLEUINBzQZrZLUBLlui7Gn/exec',
        {
            method:'POST',
            mode:'no-cors',
            body:JSON.stringify({
                tipo:'pedido',
                pedidoId,
                clienteId:clienteActual.clienteId,
                productos,
                total
            })
        }
    );

    document.getElementById('contenido-dinamico').innerHTML = `

        <div style="text-align:center;padding:20px;">

            <h2 style="color:#28a745;">
                ✅ Pedido recibido
            </h2>

            <p>
                Hemos recibido tu pedido correctamente.
            </p>

            <p>
                <strong>Pedido:</strong>
                ${pedidoId}
            </p>

            <p>
                <strong>Total:</strong>
                $${total}
            </p>

            <p>
                Revisa tu correo para más detalles.
            </p>

        </div>

    `;

    setTimeout(() => {

        carrito = [];

        actualizarCarrito();

        document.getElementById('carrito-contador').innerText =
            '🛒 0';

        cerrarModalCliente();

        document.getElementById('panel-carrito')
            .classList.remove('abierto');

    }, 5000);

}
    function mostrarConfirmacionPedido(
    pedidoId,
    total
){

    document.getElementById('contenido-dinamico').innerHTML = `

        <div style="
            text-align:center;
            padding:20px;
        ">

            <h2 style="color:#28a745;">
                ✅ Pedido Recibido
            </h2>

            <p>
                Hemos recibido tu pedido correctamente.
            </p>

            <div style="
                background:#f8f9fa;
                padding:20px;
                border-radius:10px;
                margin:15px 0;
            ">

                <strong>Número de Pedido</strong>

                <h3>${pedidoId}</h3>

                <strong>Total</strong>

                <h3>$${total}</h3>

            </div>

            <p>
                Te enviamos una copia del pedido
                a tu correo electrónico.
            </p>

            <button
    onclick="cerrarConfirmacion()"
    style="
        background:#28a745;
        color:white;
        border:none;
        padding:12px 25px;
        border-radius:10px;
        cursor:pointer;
        font-weight:bold;
        margin-top:15px;
    "
>
    Cerrar
</button>

        </div>

    `;

    carrito = [];

    actualizarCarrito();

    document.getElementById(
        'carrito-contador'
    ).innerText = '🛒 0';

    setTimeout(() => {

    cerrarConfirmacion();

}, 5000);

}
function cerrarConfirmacion(){

    carrito = [];

    actualizarCarrito();

    document.getElementById('carrito-contador').innerText =
        '🛒 0';

    cerrarModalCliente();

    document.getElementById('panel-carrito')
        .classList.remove('abierto');

}
    function filtrarCategoria(categoria){

    categoriaActual = categoria;

    aplicarFiltros();

}
    function aplicarFiltros(){

    const texto =
        document.getElementById('buscador')
        .value
        .toLowerCase();

    let productos = productosGlobal;

    if(categoriaActual !== 'Todos'){

        productos =
            productos.filter(producto =>
                producto.categoria === categoriaActual
            );

    }

    productos =
        productos.filter(producto =>
            producto.nombre
                .toLowerCase()
                .includes(texto)
        );

    renderizarProductos(productos);

}

function actualizarCarrito(){

    let html = '';
    let total = 0;

    carrito.forEach((producto, index) => {

        total += Number(producto.precio);

        html += `
<div class="item-carrito">

    <div class="item-superior">

        <div>
            <strong>${producto.nombre}</strong>
            <br>
            $${producto.precio}
        </div>

     <button
    class="btn-eliminar"
    onclick="eliminarDelCarrito(${index})">

    🗑️

</button>

    </div>

</div>
`;
        });

    document.getElementById('lista-carrito').innerHTML =
        html;

    document.getElementById('total-carrito').innerText =
        'Total: $' + total;

}

document.getElementById('buscador')
    .addEventListener('input', aplicarFiltros);

</script>
<div id="panel-carrito">

    <div class="header-carrito">

        <h2>Mi Carrito</h2>

        <button id="cerrar-carrito" onclick="toggleCarrito()">
            ✕
        </button>

    </div>

    <div id="lista-carrito"></div>

    <hr>

    <h3 id="total-carrito">
        Total: $0
    </h3>

 <button id="btn-finalizar" onclick="abrirFormularioCliente()">
    Finalizar Pedido
</button>

</div>

<div id="mensaje-exito">
    ✅ Producto agregado al carrito
</div>
<div id="modal-cliente">

    <div id="contenido-cliente">

       <div class="header-modal">

    <h2>Identificación de Cliente</h2>

    <button id="cerrar-modal" onclick="cerrarModalCliente()">
        ✕
    </button>

</div>
 <p>
        Selecciona una opción para continuar:
    </p>
        <button onclick="soyCliente()">
            ✅ Ya soy cliente
        </button>

        <button onclick="clienteNuevo()">
            🆕 Soy cliente nuevo
        </button>

        <div id="contenido-dinamico"></div>

    </div>

</div>
    
</body>

</html>
