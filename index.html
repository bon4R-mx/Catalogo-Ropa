<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tu lugar privado para tu ropa</title>

    <style>

        body{
            font-family:'Segoe UI',sans-serif;
            background:#fafafa;
            margin:0;
            padding:0;
        }

        header{
            background:white;
            padding:30px;
            text-align:center;
            box-shadow:0 2px 10px rgba(0,0,0,.06);
        }

        header h1{
            margin:0;
            font-size:40px;
        }

        header p{
            color:#666;
            margin-top:10px;
        }

        #carrito-contador{
            margin-top:15px;
            font-weight:bold;
            font-size:18px;
        }

        .contenedor{
            max-width:1200px;
            margin:auto;
            padding:30px;
        }

        .catalogo{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card img{
            width:100%;
            height:350px;
            object-fit:cover;
        }

        .info{
            padding:20px;
        }

        .precio{
            color:#00a43c;
            font-size:28px;
            font-weight:bold;
        }

        .tallas{
            color:#666;
        }

        .btn-carrito{
            width:100%;
            background:#111;
            color:white;
            border:none;
            padding:12px;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
            margin-top:15px;
            font-size:15px;
        }

        .btn-carrito:hover{
            background:#333;
        }

    </style>

</head>

<body>

    <header>
        <h1>BON4R FASHION</h1>
        <p>Moda para cualquier ocasión</p>

        <div id="carrito-contador">
            🛒 Carrito: 0
        </div>
    </header>

    <div class="contenedor">

        <div class="catalogo" id="catalogo"></div>

    </div>

    <script>

        let carrito = [];

        fetch('productos.json')
        .then(response => response.json())
        .then(productos => {

            let html = '';

            productos.forEach(producto => {

                html += `
                <div class="card">

                    <img src="${producto.imagen}" alt="${producto.nombre}">

                    <div class="info">

                        <h3>${producto.nombre}</h3>

                        <p class="precio">$${producto.precio}</p>

                        <p class="tallas">
                            Tallas: ${producto.tallas}
                        </p>

                        <button
                            class="btn-carrito"
                            onclick="agregarCarrito('${producto.sku}')">
                            🛒 Agregar al carrito
                        </button>

                    </div>

                </div>
                `;

            });

            document.getElementById('catalogo').innerHTML = html;

        });

        function agregarCarrito(sku){

            carrito.push(sku);

            document.getElementById('carrito-contador').innerText =
                '🛒 Carrito: ' + carrito.length;

            console.log('Producto agregado:', sku);

        }

    </script>

</body>

</html>
