<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BON4R FASHION</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:'Segoe UI',sans-serif;
            background:#fafafa;
        }

        header{
            background:white;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
            padding:20px;
        }

        .header-top{
            max-width:1200px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h1{
            margin:0;
            font-size:38px;
        }

        header p{
            margin:5px 0 0 0;
            color:#666;
        }

        #carrito-contador{
            background:#111;
            color:white;
            padding:12px 20px;
            border-radius:999px;
            font-weight:bold;
        }

        .hero{

            height:400px;

            background:
            linear-gradient(
                rgba(0,0,0,.45),
                rgba(0,0,0,.45)
            ),
            url("imagenes/playera-negra.jpg");

            background-size:cover;
            background-position:center;

            display:flex;
            justify-content:center;
            align-items:center;

            text-align:center;
            color:white;
        }

        .hero h2{
            font-size:56px;
            margin:0;
        }

        .hero p{
            font-size:20px;
            margin-top:10px;
        }

        .btn-ver{
            display:inline-block;
            margin-top:20px;
            background:white;
            color:black;
            text-decoration:none;
            padding:12px 25px;
            border-radius:10px;
            font-weight:bold;
        }

        .contenedor{
            max-width:1200px;
            margin:auto;
            padding:30px;
        }

        #buscador{
            width:100%;
            padding:15px;
            font-size:16px;
            border:1px solid #ddd;
            border-radius:12px;
            margin-bottom:30px;
        }

        .catalogo{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card img{
            width:100%;
            height:350px;
            object-fit:cover;
        }

        .info{
            padding:20px;
        }

        .info h3{
            margin-top:0;
        }

        .precio{
            color:#00a43c;
            font-size:28px;
            font-weight:bold;
        }

        .tallas{
            color:#666;
        }

        .btn-carrito{
            width:100%;
            border:none;
            background:#111;
            color:white;
            padding:12px;
            border-radius:10px;
            font-weight:bold;
            cursor:pointer;
            margin-top:15px;
        }

        .btn-carrito:hover{
            background:#333;
        }

    </style>

</head>

<body>

<header>

    <div class="header-top">

        <div>
            <h1>BON4R FASHION</h1>
            <p>Moda para cualquier ocasión</p>
        </div>

        <div id="carrito-contador">
            🛒 0
        </div>

    </div>

</header>

<section class="hero">

    <div>

        <h2>Nueva Colección</h2>

        <p>
            Descubre prendas seleccionadas para cualquier ocasión
        </p>

        <a class="btn-ver" href="#catalogo">
            Ver Catálogo
        </a>

    </div>

</section>

<div class="contenedor">

    <input
        type="text"
        id="buscador"
        placeholder="🔍 Buscar producto..."
    >

    <div class="catalogo" id="catalogo"></div>

</div>

<script>

let carrito = [];
let productosGlobal = [];

fetch('productos.json')
.then(response => response.json())
.then(productos => {

    productosGlobal = productos;

    os);

})
.catch(error => {

    console.error(error);

    document.getElementById('catalogo').innerHTML =
    '<h2>Error cargando productos</h2>';

});

function renderizarProductos(productos){

    let html = '';

    productos.forEach(producto => {

        html += `
        <div class="card">

            <img src="${producto.imagen}" alt="${producto.nombre}">

            <div class="info">

                <h3>${producto.nombre}</h3>

                <p class="precio">
                    $${producto.precio}
                </p>

                <p class="tallas">
                    Tallas: ${producto.tallas}
                </p>

                <button
                    class="btn-carrito"
                    onclick="agregarCarrito('${producto.sku}')">

                    🛒 Agregar al carrito

                </button>

            </div>

        </div>
        `;

    });

    document.getElementById('catalogo').innerHTML = html;

}

function agregarCarrito(sku){

    carrito.push(sku);

    document.getElementById('carrito-contador').innerText =
    '🛒 ' + carrito.length;

}

document.getElementById('buscador').addEventListener('input', function(){

    const texto = this.value.toLowerCase();

    const filtrados = productosGlobal.filter(producto =>
        producto.nombre.toLowerCase().includes(texto)
    );

    renderizarProductos(filtrados);

});

</script>

</body>

</html>
