<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Catálogo de Ropa</title>

<style>

body{
    font-family: 'Segoe UI', sans-serif;
    background:#fafafa;
    margin:0;
    padding:0;
}

header{
    background:white;
    padding:30px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

header h1{
    margin:0;
    font-size:40px;
}

header p{
    color:#666;
}

.contenedor{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.catalogo{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:350px;
    object-fit:cover;
}

.info{
    padding:20px;
}

.precio{
    color:#00a43c;
    font-size:28px;
    font-weight:bold;
}

.btn-whatsapp{
    display:block;
    margin-top:15px;
    text-align:center;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>Catálogo de Ropa</h1>

<div class="catalogo" id="catalogo"></div>

<script>

fetch('productos.json')
.then(response => response.json())
.then(productos => {

let html = '';

productos.forEach(producto => {

html += `
<div class="card">

<img src="${producto.imagen}" alt="${producto.nombre}">

<div class="info">

<h3>${producto.nombre}</h3>

<p class="precio">$${producto.precio}</p>

<p class="tallas">
Tallas: ${producto.tallas}
</p>

</div>

</div>
`;

});

document.getElementById('catalogo').innerHTML = html;

});

</script>

</body>
</html>
